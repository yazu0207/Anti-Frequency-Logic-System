<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AFLS Tool</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP&display=swap" rel="stylesheet">

<style>
body{font-family:"Noto Sans JP",Arial;max-width:1000px;margin:auto;padding:12px}
.section{border:1px solid #ddd;padding:12px;margin:10px 0;border-radius:8px}
button{padding:8px 12px;margin:4px;border-radius:6px;border:0;background:#0b72ff;color:#fff}
select,input{padding:6px}
table{width:100%;border-collapse:collapse;margin-top:10px}
td,th{border:1px solid #ddd;padding:6px;text-align:center}
.log{background:#000;color:#0f0;height:120px;overflow:auto;font-size:12px;padding:6px}
</style>
</head>

<body>

<h2>Anti-Frequency Logic System</h2>

<div class="section">
CSV：
<input type="file" id="csvFile">
<button id="btnLoadCsv">読込</button>
<div id="csvInfo">未読込</div>
</div>

<div class="section">
比較範囲：
<select id="manualRange">
  <option value="30">30回</option>
  <option value="50">50回</option>
  <option value="100">100回</option>
  <option value="all">全履歴</option>
</select>
</div>

<div class="section">
<button id="btnGenM">M生成</button>
<button id="btnCompare">照合</button>
</div>

<div class="section">
<h3>結果</h3>
<div id="resultArea"></div>
</div>

<div class="section">
ログ
<div id="log" class="log"></div>
</div>

<script src="main.js"></script>

</body>
</html>
