<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AFLS Tool</title>

<style>
body{font-family:Arial;max-width:1000px;margin:auto;padding:12px}
.section{border:1px solid #ddd;padding:12px;margin:10px 0;border-radius:8px}
button{padding:8px 12px;margin:4px}
input{width:40px;margin:2px}
input[type="file"]{
  width:100%;
  padding:6px;
  background:#f5f5f5;
}
table{width:100%;border-collapse:collapse;margin-top:10px}
td,th{border:1px solid #ddd;padding:6px;text-align:center}
.log{background:#000;color:#0f0;height:120px;overflow:auto;font-size:12px;padding:6px}
</style>
</head>

<body>

<h2>AFLS Tool</h2>

<div class="section">
<h3>過去データCSV</h3>
<input type="file" id="csvFile">
<button id="btnLoadCsv">読込</button>
<div id="csvInfo"></div>
</div>

<div class="section">
<h3>比較範囲</h3>
<select id="manualRange">
<option value="30">30回</option>
<option value="50">50回</option>
<option value="100">100回</option>
<option value="all">全履歴</option>
</select>
</div>

<div class="section">
<h3>手動入力（5行×7個）</h3>
<div id="manualArea"></div>
</div>

<div class="section">
<h3>候補CSV（5行×7）</h3>
<input type="file" id="candidateCsv">
<button id="btnLoadCandidate">CSV読込</button>
</div>

<div class="section">
<button id="btnGenM">自動生成</button>
<button id="btnCompare">照合</button>
</div>

<div class="section">
<div id="resultArea"></div>
</div>

<div class="section">
<div id="log" class="log"></div>
</div>

<script src="main.js"></script>
</body>
</html>
